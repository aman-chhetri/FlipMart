<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <!-- Bootstrap core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Custom styles */
        .cart-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
        }
        .item-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            margin-right: 10px;
        }
        .item-details {
            flex-grow: 1;
        }
        .item-name {
            font-weight: bold;
        }
        .item-price {
            color: #888;
        }
        .remove-btn {
            color: #d9534f;
            cursor: pointer;
        }
    
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-warning">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Shopping Cart</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="recipe">Recipe</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="recipeinfo">Recipe Info</a>
              </li>
             
            </ul>
            <form class="d-flex" role="search">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
              <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
          </div>
        </div>
      </nav>

    <div class="container mt-5">
        <div class="cart-container">
            <h2>Shopping Cart</h2>
            <div class="cart-item">
                <img class="item-image" src="/static/images/flour.jpg" alt="Flour">
                <div class="item-details">
                    <p class="item-name">Plain Flour</p>
                    <p class="item-price">$19.99</p>
                </div>
                <span class="remove-btn" onclick="removeItem(this)">Remove</span>
            </div>
            <div class="cart-item">
                <img class="item-image" src="/static/images/oil.jpg" alt="Oil">
                <div class="item-details">
                    <p class="item-name">Olive Oil</p>
                    <p class="item-price">$29.99</p>
                </div>
                <span class="remove-btn" onclick="removeItem(this)">Remove</span>
            </div>
            <div class="cart-item">
                <img class="item-image" src="/static/images/cheese.jpg" alt="Cheese">
                <div class="item-details">
                    <p class="item-name">Cheese</p>
                    <p class="item-price">$29.99</p>
                </div>
                <span class="remove-btn" onclick="removeItem(this)">Remove</span>
            </div>
            <div class="cart-item">
                <img class="item-image" src="/static/images/sugar.jpg" alt="Sugar">
                <div class="item-details">
                    <p class="item-name">Sugar</p>
                    <p class="item-price">$29.99</p>
                </div>
                <span class="remove-btn" onclick="removeItem(this)">Remove</span>
            </div>
            <div class="d-grid gap-2 col-6 mx-auto">
                <button class="btn btn-success" type="button">Checkout</button>

            <!-- Add more cart items as needed -->
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function removeItem(element) {
            element.closest('.cart-item').remove();
        }
    </script>
</body>
</html>
